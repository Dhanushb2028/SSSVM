services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sssvm
      POSTGRES_PASSWORD: sssvm_dev_password
      POSTGRES_DB: sssvm
    ports:
      - "5432:5432"
    volumes:
      - sssvm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sssvm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sssvm_postgres_data:
